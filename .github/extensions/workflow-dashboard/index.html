<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PR workflows</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="eyebrow">trask / copilot-workflows</div>
    <h1>PR workflows</h1>
    <div class="controls">
      <button id="refresh">Refresh</button>
      <label><input id="auto" type="checkbox" checked> Auto refresh every 60s</label>
    </div>
    <p id="pause" class="notice" hidden></p>
    <p id="error" class="error" role="alert" hidden></p>
  </header>
  <main>
    <section aria-labelledby="prs-title">
      <h2 id="prs-title">Open PRs <span id="pr-count" class="badge"></span></h2>
      <div class="filters">
        <label>Repository<select id="repo"></select></label>
        <div class="ownership" role="radiogroup" aria-label="PR author">
          <label class="toggle"><input id="mine" type="radio" name="ownership" checked> My PRs</label>
          <label class="toggle"><input id="others" type="radio" name="ownership"> Not my PRs</label>
          <label class="toggle"><input id="bots" type="radio" name="ownership"> Bot PRs</label>
        </div>
        <label class="toggle"><input id="reviewers" type="checkbox"> Waiting on reviewers</label>
        <label class="search">Search<input id="search" type="search" placeholder="Title, PR number, or author"></label>
      </div>
      <p id="loading" class="notice loading" role="status" aria-atomic="true" hidden>
        <span class="task-marker spinner" aria-hidden="true"></span>
        <span id="loading-message"></span>
      </p>
      <div id="warnings" class="notice" hidden></div>
      <div id="prs" aria-busy="false"></div>
    </section>
    <section aria-labelledby="run-log-title">
      <h2 id="run-log-title">Workflow run log <span id="run-log-count" class="badge" hidden></span></h2>
      <div class="row">
        <label>Hours back <input id="run-log-hours" type="number" min="1" step="1" value="2"></label>
        <p class="muted">Finished tasks in the selected repository. Loads after the PRs.</p>
        <button id="load-run-log" type="button">Load run log</button>
      </div>
      <p id="run-log-error" class="error" role="alert" hidden></p>
      <p id="run-log-warnings" class="notice" hidden></p>
      <div id="run-log" aria-busy="false"></div>
    </section>
  </main>
  <dialog id="task-details" class="task-details" aria-labelledby="task-details-title" aria-describedby="task-details-status task-details-message">
    <h2 id="task-details-title"></h2>
    <p id="task-details-status" class="title"></p>
    <p id="task-details-message"></p>
    <p id="task-details-links"></p>
    <button id="close-task-details" type="button" autofocus>Close</button>
  </dialog>
  <div id="link-menu" class="link-menu" role="menu" aria-label="Link actions" hidden>
    <button id="copy-link" type="button" role="menuitem">Copy link</button>
  </div>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
